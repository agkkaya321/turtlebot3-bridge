[package]
name = "turtlebot-speed-bridge"
version = "0.1.0"
edition = "2021"
rust-version = "1.82"
publish = false

[dependencies]
r2r = "=0.9.7"
tiny_http = "0.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ctrlc = { version = "3.4", features = ["termination"] }
futures = "0.3"
nix = { version = "0.29", features = ["signal", "process"] }
